name: Run all tests
on:
  schedule:
    - cron: '0 5 * * *'  # once per day at midnight ET
  push:
    tags:  # run only on new tags that follow semver
      - '/^[0-9]+(\.[0-9]+)?(\.[0-9]+)?$/'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  run-all-tests:
    # the only differences between this job and "run_tests.yml" is the "strategy.matrix.include" and the upload
    # distributions step.
    # GitHub Actions does not yet support YAML anchors, easily reusable components, or easy dynamic matrix
    # configurations based on the github event, so this job is duplicated for the most part
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: linux-python3.10-minimum     , test-tox-env: test-py310-minimum        , python-ver: "3.10", os: ubuntu-latest }
          - { name: linux-python3.11             , test-tox-env: test-py311-upgraded         , python-ver: "3.11", os: ubuntu-latest }
          - { name: linux-python3.12             , test-tox-env: test-py312-upgraded         , python-ver: "3.12", os: ubuntu-latest }
          - { name: linux-python3.13             , test-tox-env: test-py313-upgraded         , python-ver: "3.13", os: ubuntu-latest }
          - { name: linux-python3.13-opt         , test-tox-env: test-py313-upgraded-optional, python-ver: "3.13", os: ubuntu-latest }
          - { name: linux-python3.14             , test-tox-env: test-py314-upgraded         , python-ver: "3.14", os: ubuntu-latest }
          - { name: linux-python3.14-upgraded    , test-tox-env: test-py314-upgraded       , python-ver: "3.14", os: ubuntu-latest }
          - { name: linux-python3.14-prerelease  , test-tox-env: test-py314-prerelease     , python-ver: "3.14", os: ubuntu-latest }
          - { name: windows-python3.10-minimum   , test-tox-env: test-py310-minimum        , python-ver: "3.10", os: windows-latest }
          - { name: windows-python3.11           , test-tox-env: test-py311-upgraded         , python-ver: "3.11", os: windows-latest }
          - { name: windows-python3.12           , test-tox-env: test-py312-upgraded         , python-ver: "3.12", os: windows-latest }
          - { name: windows-python3.13           , test-tox-env: test-py313-upgraded         , python-ver: "3.13", os: windows-latest }
          - { name: windows-python3.13-opt       , test-tox-env: test-py313-upgraded-optional, python-ver: "3.13", os: windows-latest }
          - { name: windows-python3.14           , test-tox-env: test-py314-upgraded         , python-ver: "3.14", os: windows-latest }
          - { name: windows-python3.14-upgraded  , test-tox-env: test-py314-upgraded       , python-ver: "3.14", os: windows-latest }
          - { name: windows-python3.14-prerelease, test-tox-env: test-py314-prerelease     , python-ver: "3.14", os: windows-latest }
          - { name: macos-python3.10-minimum     , test-tox-env: test-py310-minimum        , python-ver: "3.10", os: macos-15-intel }
          - { name: macos-python3.11             , test-tox-env: test-py311-upgraded         , python-ver: "3.11", os: macos-latest }
          - { name: macos-python3.12             , test-tox-env: test-py312-upgraded         , python-ver: "3.12", os: macos-latest }
          - { name: macos-python3.13             , test-tox-env: test-py313-upgraded         , python-ver: "3.13", os: macos-latest }
          - { name: macos-python3.13-opt         , test-tox-env: test-py313-upgraded-optional, python-ver: "3.13", os: macos-latest }
          - { name: macos-python3.14             , test-tox-env: test-py314-upgraded         , python-ver: "3.14", os: macos-latest }
          - { name: macos-python3.14-upgraded    , test-tox-env: test-py314-upgraded       , python-ver: "3.14", os: macos-latest }
          - { name: macos-python3.14-prerelease  , test-tox-env: test-py314-prerelease     , python-ver: "3.14", os: macos-latest }
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: 'recursive'
          fetch-depth: 0  # tags are required for versioneer to determine the version

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-ver }}

      - name: Install build dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install tox
          python -m pip list

      - name: Run tox tests
        run: |
          tox -e ${{ matrix.test-tox-env }}

      - name: Build wheel and source distribution
        run: |
          tox -e build
          ls -1 dist

      - name: Test installation from a wheel
        run: |
          tox -e wheelinstall --recreate --installpkg dist/*-none-any.whl

  run-all-gallery-tests:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: linux-gallery-python3.10-minimum     , test-tox-env: gallery-py310-minimum   , python-ver: "3.10", os: ubuntu-latest }
          - { name: linux-gallery-python3.14-upgraded    , test-tox-env: gallery-py314-upgraded  , python-ver: "3.14", os: ubuntu-latest }
          - { name: linux-gallery-python3.14-prerelease  , test-tox-env: gallery-py314-prerelease, python-ver: "3.14", os: ubuntu-latest }
          - { name: windows-gallery-python3.10-minimum   , test-tox-env: gallery-py310-minimum   , python-ver: "3.10", os: windows-latest }
          - { name: windows-gallery-python3.14-upgraded  , test-tox-env: gallery-py314-upgraded  , python-ver: "3.14", os: windows-latest }
          - { name: windows-gallery-python3.14-prerelease, test-tox-env: gallery-py314-prerelease, python-ver: "3.14", os: windows-latest }
          - { name: macos-gallery-python3.10-minimum     , test-tox-env: gallery-py310-minimum   , python-ver: "3.10", os: macos-15-intel }
          # macOS gallery uses py313: dandi pins numcodecs<0.16, which lacks py314 macOS wheels
          - { name: macos-gallery-python3.13-upgraded    , test-tox-env: gallery-py313-upgraded  , python-ver: "3.13", os: macos-latest }
          - { name: macos-gallery-python3.13-prerelease  , test-tox-env: gallery-py313-prerelease, python-ver: "3.13", os: macos-latest }
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: 'recursive'
          fetch-depth: 0  # tags are required for versioneer to determine the version

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-ver }}

      - name: Install build dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install tox
          python -m pip list

      - name: Run tox tests
        run: |
          tox -e ${{ matrix.test-tox-env }}

  run-all-tests-on-conda:
    name: ${{ matrix.name }}
    runs-on: ubuntu-latest
    defaults:
     run:
       shell: bash -l {0}  # needed for conda environment to work
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: conda-linux-python3.10-minimum   , test-tox-env: test-py310-minimum   , python-ver: "3.10", os: ubuntu-latest }
          - { name: conda-linux-python3.11           , test-tox-env: test-py311-upgraded    , python-ver: "3.11", os: ubuntu-latest }
          - { name: conda-linux-python3.12           , test-tox-env: test-py312-upgraded    , python-ver: "3.12", os: ubuntu-latest }
          - { name: conda-linux-python3.13           , test-tox-env: test-py313-upgraded    , python-ver: "3.13", os: ubuntu-latest }
          - { name: conda-linux-python3.14           , test-tox-env: test-py314-upgraded    , python-ver: "3.14", os: ubuntu-latest }
          - { name: conda-linux-python3.14-upgraded  , test-tox-env: test-py314-upgraded  , python-ver: "3.14", os: ubuntu-latest }
          - { name: conda-linux-python3.14-prerelease, test-tox-env: test-py314-prerelease, python-ver: "3.14", os: ubuntu-latest }
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: 'recursive'
          fetch-depth: 0  # tags are required for versioneer to determine the version

      - name: Set up Conda
        uses: conda-incubator/setup-miniconda@v4
        with:
          auto-update-conda: true
          python-version: ${{ matrix.python-ver }}

      - name: Install build dependencies
        run: |
          conda config --set always_yes yes --set changeps1 no
          conda info
          conda install -c conda-forge "tox>=4.0"

      - name: Conda reporting
        run: |
          conda info
          conda config --show-sources
          conda list --show-channel-urls

      - name: Run tox tests
        run: |
          tox -e ${{ matrix.test-tox-env }}

      - name: Build wheel and source distribution
        run: |
          tox -e build
          ls -1 dist

      - name: Test installation from a wheel
        run: |
          tox -e wheelinstall --recreate --installpkg dist/*-none-any.whl


  run-ros3-tests:  # tox and conda do not play nicely so do not use tox here
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20  # backstop against the HDF5 ros3 shutdown deadlock on Windows
    defaults:
      run:
        shell: bash -l {0}  # necessary for conda
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: conda-linux-python3.14-ros3  , python-ver: "3.14", os: ubuntu-latest }
          - { name: conda-windows-python3.14-ros3, python-ver: "3.14", os: windows-latest }
          - { name: conda-macos-python3.14-ros3  , python-ver: "3.14", os: macos-latest }
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: 'recursive'
          fetch-depth: 0  # tags are required for versioneer to determine the version

      - name: Set up Conda
        uses: conda-incubator/setup-miniconda@v4
        with:
          auto-update-conda: true
          activate-environment: ros3
          environment-file: environment-ros3.yml
          python-version: ${{ matrix.python-ver }}
          channels: conda-forge
          conda-remove-defaults: "true"
          auto-activate: false

      - name: Install run dependencies
        run: |
          pip install --group test .
          conda info
          conda list
          pip list

      - name: Run ros3 tests
        run: |
          python run_ros3_hang_safe.py --ros3

  run-gallery-ros3-tests:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20  # backstop against the HDF5 ros3 shutdown deadlock on Windows
    defaults:
      run:
        shell: bash -l {0}  # necessary for conda
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: conda-linux-gallery-python3.14-ros3  , python-ver: "3.14", os: ubuntu-latest }
          - { name: conda-windows-gallery-python3.14-ros3, python-ver: "3.14", os: windows-latest }
          - { name: conda-macos-gallery-python3.14-ros3  , python-ver: "3.14", os: macos-latest }
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: 'recursive'
          fetch-depth: 0  # tags are required for versioneer to determine the version

      - name: Set up Conda
        uses: conda-incubator/setup-miniconda@v4
        with:
          auto-update-conda: true
          activate-environment: ros3
          environment-file: environment-ros3.yml
          python-version: ${{ matrix.python-ver }}
          channels: conda-forge
          conda-remove-defaults: "true"
          auto-activate: false

      - name: Install run dependencies
        run: |
          pip install --group docs ".[zarr,termset]"
          pip list

      - name: Conda reporting
        run: |
          conda info
          conda config --show-sources
          conda list --show-channel-urls

      - name: Run gallery ros3 tests
        run: |
          python run_ros3_hang_safe.py --example-ros3

  # the streaming HERD gallery example is excluded from the offline example
  # tests (it streams from the DANDI Archive), so run it once here
  run-streaming-example:
    name: linux-streaming-example-python3.14
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: 'recursive'
          fetch-depth: 0  # tags are required for versioneer to determine the version

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.14"

      - name: Install run dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install dandi fsspec tqdm aiohttp requests .
          python -m pip list

      - name: Run the DANDI streaming HERD example
        run: |
          python docs/gallery/general/resources_streaming.py
