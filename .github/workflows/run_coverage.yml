name: Run code coverage
on:
  push:
    branches:
      - dev
    tags-ignore:  # exclude tags created by "ci_addons publish_github_release"
      - 'latest'
      - 'latest-tmp'
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  run-coverage:
    name: ${{ matrix.os }}, opt reqs ${{ matrix.opt_req }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    concurrency:
      group: ${{ github.workflow }}-${{ github.ref }}-${{ matrix.os }}-${{ matrix.opt_req }}
      cancel-in-progress: true
    defaults:
      run:
        shell: bash
    strategy:
      matrix:
        include:
          - { os: ubuntu-latest , opt_req: true }
          - { os: ubuntu-latest , opt_req: false }
          - { os: windows-latest, opt_req: false }
          - { os: macos-latest  , opt_req: false }
    env:  # used by codecov-action
      OS: ${{ matrix.os }}
      PYTHON: '3.14'
    steps:
      - name: Checkout repo with submodules
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
          submodules: 'recursive'
          fetch-depth: 0  # tags are required for versioneer to determine the version

      - name: Set up Python
        # This workflow uploads coverage percentages to Codecov and produces no artifact, so a
        # restored pip cache cannot reach a consumer.
        uses: actions/setup-python@v7.0.0  # zizmor: ignore[cache-poisoning]
        with:
          python-version: ${{ env.PYTHON }}
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install --group test .

      - name: Install optional dependencies
        if: ${{ matrix.opt_req }}
        run: python -m pip install --group test --group stream ".[zarr,termset]"

      - name: Install package
        run: |
          python -m pip install .
          python -m pip list

      - name: Run unit tests and generate coverage report
        run: |
          python -m coverage run test.py --pynwb
          python -m coverage xml  # codecov uploader requires xml format
          python -m coverage report

      - name: Upload coverage to Codecov
        # CODECOV_TOKEN is not exposed to a pull request from a fork, so the upload is skipped
        # there and the tests above still run.
        if: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}
        # immutable release (see .github/zizmor.yml for the policy exception)
        uses: codecov/codecov-action@v7.0.0
        with:
          flags: unit
          files: ./coverage.xml
          fail_ci_if_error: true
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}

      - name: Run integration tests and generate coverage report
        run: |
          python -m coverage run -p test.py --integration --validation-module --backwards
          # validation CLI tests generate separate .coverage files that need to be merged
          python -m coverage combine
          python -m coverage xml  # codecov uploader requires xml format
          python -m coverage report

      - name: Upload coverage to Codecov
        # CODECOV_TOKEN is not exposed to a pull request from a fork, so the upload is skipped
        # there and the tests above still run.
        if: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}
        # immutable release (see .github/zizmor.yml for the policy exception)
        uses: codecov/codecov-action@v7.0.0
        with:
          flags: integration
          files: ./coverage.xml
          fail_ci_if_error: true
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}
