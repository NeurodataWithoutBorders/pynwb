# pinned dependencies to reproduce an entire development environment to use PyNWB with ROS3 support
name: ros3
channels:
  - conda-forge
  - defaults
dependencies:
  - python==3.14
  - h5py==3.16.0
  - matplotlib==3.9.2
  - numpy==2.4.3
  - pandas==2.3.3
  - python-dateutil==2.9.0
  - setuptools
  - pytest==9.0.2
  - fsspec==2025.5.1
  - requests==2.32.3
  - aiohttp==3.12.13
  - pip
  - pip:
    - hdmf==5.0.0  # not yet available on conda-forge
    - remfile==0.1.13
    - dandi==0.62.1  # NOTE: dandi is not available on conda for osx-arm64
