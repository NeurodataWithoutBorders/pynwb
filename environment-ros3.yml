# pinned dependencies to reproduce an entire development environment to use PyNWB with ROS3 support
name: ros3
channels:
  - conda-forge
  - defaults
dependencies:
  - python==3.14
  - h5py==3.16.0
  - hdmf==6.2.0
  - matplotlib==3.11.1
  - numpy==2.5.2
  - pandas==3.0.5
  - python-dateutil==2.9.0.post0
  - setuptools
  - pytest==9.1.1
  - fsspec==2026.7.0
  - requests==2.34.2
  - aiohttp==3.14.3
  - pip
# remfile and dandi are pip-only (dandi is not available on conda for osx-arm64). The ros3 CI jobs
# install them in a separate "pip install -v" step so that pip's output reaches the workflow log;
# their pins live in .github/workflows/run_tests.yml and .github/workflows/run_all_tests.yml.
