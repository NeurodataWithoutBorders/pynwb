# pinned dependencies to reproduce an entire development environment to use PyNWB with ROS3 support
name: ros3
channels:
  - conda-forge
dependencies:
  - python==3.14
  # select the GIL build of CPython. tensorstore publishes a cp314 Windows wheel but no
  # free-threaded one, and building it from source is an 8,000-action Bazel compile that
  # overruns the CI job timeout. See #2246.
  - python-gil
  - h5py==3.16.0
  - hdmf==6.2.0
  - matplotlib==3.11.1
  - numpy==2.5.2
  - pandas==3.0.5
  - python-dateutil==2.9.0.post0
  - setuptools
  - pytest==9.1.1
  - fsspec==2026.7.0
  - requests==2.34.2
  - aiohttp==3.14.3
  - dandi==0.78.0
  - pip
  - pip:
    - remfile==0.1.14  # remfile is not packaged on conda-forge
