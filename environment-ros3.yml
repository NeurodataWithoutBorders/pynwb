# pinned dependencies to reproduce an entire development environment to use PyNWB with ROS3 support
name: ros3
channels:
  - conda-forge
  - defaults
dependencies:
  - python==3.14
  # select the GIL build of CPython. several packages do not publish free-threaded Windows wheels,
  # and pip building them from source overruns the CI job timeout. See #2246.
  - python-gil
  - h5py==3.16.0
  - hdmf==6.2.0
  - matplotlib==3.11.1
  - numpy==2.5.2
  - pandas==3.0.5
  - python-dateutil==2.9.0.post0
  - setuptools
  - pytest==9.1.1
  - fsspec==2026.7.0
  - requests==2.34.2
  - aiohttp==3.14.3
  - pip
  - pip:
    - remfile==0.1.14  # remfile is not packaged on conda-forge
    - dandi==0.77.0  # PyPI carries releases newer than the conda-forge build
